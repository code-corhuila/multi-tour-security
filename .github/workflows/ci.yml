name: ci

# gofmt, go vet and go test against a throwaway PostgreSQL service, then the db-ci of the migrations.
# Pull requests toward develop and qa only, to save the course's automation minutes. No schedule.
on:
  pull_request:
    branches: [develop, qa]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: multitour_test
          # a throwaway service of the job: no password, nothing to leak
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d multitour_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/multitour_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      # Builds the security schema from an empty PostgreSQL, reruns, rolls back and rebuilds (Annex A, db-ci)
      - name: db-ci
        run: sh db/tests/db-ci.sh
      # The service image the root composition runs: it must build in the pipeline, not only on a laptop
      - name: service image
        run: docker build --tag multi-tour-security:ci .
