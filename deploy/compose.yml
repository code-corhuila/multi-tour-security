# The security service and the migration runner of its schema. It defines no database and no volume: the instance is
# that of multi-tour-infra-postgres, which includes this file in the root composition (Annex J, J.7).
# The runner does not start with `up`; run it once per environment:
#   docker compose --env-file env/dev.env run --rm security-db-migrate
services:
  security-db-migrate:
    # Liquibase 5.0.4 plus the PostgreSQL driver, at exact versions (see liquibase.Dockerfile)
    build:
      context: .
      dockerfile: liquibase.Dockerfile
    image: multi-tour-security-liquibase:5.0.4
    profiles: [tooling]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${PG_DATABASE:?PG_DATABASE is required, set it in env/<environment>.env}
      LIQUIBASE_COMMAND_USERNAME: ${PG_ADMIN_USER:?PG_ADMIN_USER is required, set it in env/<environment>.env}
      LIQUIBASE_COMMAND_PASSWORD: ${PG_ADMIN_PASSWORD:?PG_ADMIN_PASSWORD is required, set it in env/<environment>.env}
    volumes:
      - ../db:/workspace:ro
    # Own control table, so two domains never share one (Annex J, J.6)
    command:
      - --search-path=/workspace
      - --changelog-file=changelog/changelog-master.yaml
      - --database-changelog-table-name=databasechangelog_security
      - --database-changelog-lock-table-name=databasechangeloglock_security
      - update
    networks: [platform]

  security:
    # The service itself: the routes of login, accounts and the internal ones. Reached only through the gateway, so it
    # declares expose and never ports (norm 5.6.1). The keys are files of a directory of the environment, never an image layer.
    build:
      context: ..
      dockerfile: Dockerfile
    image: multi-tour-security:0.1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_PORT: "8086"
      DATABASE_URL: postgres://security_app:${SECURITY_APP_PASSWORD:?SECURITY_APP_PASSWORD is required, set it in env/<environment>.env}@postgres:5432/${PG_DATABASE:?PG_DATABASE is required, set it in env/<environment>.env}
      JWT_PRIVATE_KEY_FILE: /run/keys/private.pem
      JWT_PUBLIC_KEY_FILE: /run/keys/public.pem
      # The e-mail that carries a credential (ADR-004 D3). Nothing is guessed: development points them at Mailpit in
      # env/dev.env, and qa and main at the provider of the environment. TLS is required unless the environment says it is not.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - ${JWT_KEYS_DIR:?JWT_KEYS_DIR is required, the directory with private.pem and public.pem}:/run/keys:ro
    # the shutdown drains the requests and waits for the work after an answer within 20 seconds (cmd/security/main.go)
    stop_grace_period: 25s
    expose:
      - "8086"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8086/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [platform]

  mailpit:
    # Development only: it receives every e-mail and sends none, so a verification link can be read without a real mailbox
    # (ADR-004 D3). It does not start with `up`; the development environment turns it on with COMPOSE_PROFILES=mail-capture.
    # It declares expose and never ports (norm 5.6.1): the web page of the captured mail is read from inside the network.
    image: axllent/mailpit:v1.21.8
    profiles: [mail-capture]
    expose:
      - "1025"
      - "8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks: [platform]

networks:
  platform:
    external: true
