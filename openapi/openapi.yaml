openapi: 3.0.3
info:
  title: Multitour security
  version: 0.6.0
  description: >
    The tested copy of the design contract 07-api/contracts/openapi/security.yaml in multi-tour-docs
    (ADR-004 D7). It carries only the operations the service implements; every story adds its operations here
    before its code. The paths are the real ones, with the prefix /api/v1 that the gateway routes to this service,
    where the design contract writes them under a servers base. Every error uses the single envelope below. The
    design contract does not list yet the 413 and 415 that the service answers, nor the headers below; its alignment
    is part of the evidence task of the story.
paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  timestamp:
                    type: string
                    format: date-time
                  dependencies:
                    type: object
                    properties:
                      database:
                        type: string
                        enum: [ok, degraded, down]
  /api/v1/security/public/tenants/{identifier}/sessions:
    post:
      summary: Sign in inside the tenant of a link
      description: >
        E-mail and password of an account of the tenant of the link /t/{identifier}. Every refusal (wrong password,
        unknown e-mail, account of another tenant, unknown tenant, blocked account, inactive account) is the same 401.
        A temporary credential gets a token with empty roles, access password-change and no refresh token; the
        Administrator of an inactive tenant gets access restricted and no refresh token. A PENDING account (HU-SEC-003)
        that gives its right password gets 403 with details naming the field email and the message EMAIL_NOT_VERIFIED,
        and no token; with a wrong password it gets the same 401 as everyone, so nothing tells a stranger that the
        e-mail has an account.
      operationId: signIn
      tags: [Sessions]
      security: []
      parameters:
        - name: identifier
          in: path
          required: true
          description: Identifier of the tenant, lowercase kebab-case
          schema:
            type: string
            minLength: 3
            maxLength: 40
            pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        "200":
          $ref: '#/components/responses/Session'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/public/platform/sessions:
    post:
      summary: Sign in the Platform Administrator
      description: >
        Used at /platform. The account has no tenant, so the token has no tenantId. Same refusals and same answer as
        the sign-in of a tenant.
      operationId: platformSignIn
      tags: [Sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        "200":
          $ref: '#/components/responses/Session'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/public/sessions/refresh:
    post:
      summary: Renew the access token
      description: >
        The refresh token is opaque, single-use and lasts the 7 days of the session; a second use refuses the call and
        revokes that session. The new token carries the roles of now, and a session of an account that was
        inactivated, had its password changed, was signed out everywhere or belongs to a tenant that is not active
        cannot be renewed. Every refusal is the same 401.
      operationId: refreshSession
      tags: [Sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        "200":
          $ref: '#/components/responses/Session'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/public/tenants/{identifier}/accounts:
    post:
      summary: Create a Final Customer account in the tenant of a link
      description: >
        A person creates the account of a Final Customer inside the tenant of the link /t/{identifier}: the tenant is
        the one of the path and nothing in the body changes it. The account is created PENDING with the role
        FINAL_CUSTOMER, an ordinary password and emailVerified false, and a link that lasts 24 hours is sent to the
        e-mail (HU-SEC-003); it cannot sign in until it verifies the e-mail. A failed send is recorded and the answer is
        still 201. A repeat with the same key sends no second link. The e-mail is lower-cased and trimmed; the same e-mail in another
        tenant is another account, and in the same tenant it is refused with 422, also when the existing account is
        inactive. A tenant that does not exist is 404; one that is not ACTIVE is 422 and creates nothing. A password that
        breaks the policy or a confirmation that differs is 400 with the field in details. A repeat with the same
        Idempotency-Key answers 200 with the account already created. The answer never carries a credential. A 422 for an e-mail already in use carries details naming the field email (message "already in use"); a 422 for a tenant that is not active carries no details.
      operationId: createCustomerAccount
      tags: [Accounts]
      security: []
      parameters:
        - name: identifier
          in: path
          required: true
          description: Identifier of the tenant, lowercase kebab-case
          schema:
            type: string
            minLength: 3
            maxLength: 40
            pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerAccountRequest'
      responses:
        "201":
          $ref: '#/components/responses/Account'
        "200":
          $ref: '#/components/responses/Account'
        "400":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/users:
    get:
      summary: List the internal users of the tenant
      description: >
        The Tenant Administrator lists the users of their own tenant that hold one of the five internal roles, newest first,
        with the listing envelope (HU-SEC-005). A Final Customer is never listed. The tenant is the tenantId of the token and
        no parameter can change it; a parameter that is not declared, a repeated one or a value out of range is 400 and is
        never trimmed. role narrows to one internal role and status to ACTIVE, INACTIVE or PENDING. The answer never carries
        a password or a hash. Only a token with the role TENANT_ADMINISTRATOR, a tenant and no access mark is accepted.
      operationId: listInternalUsers
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: role
          in: query
          schema: {type: string, enum: [TENANT_ADMINISTRATOR, OPERATIONAL_COLLABORATOR, MANAGER, ACCOUNTANT, ANALYST]}
        - name: status
          in: query
          schema: {type: string, enum: [ACTIVE, INACTIVE, PENDING]}
      responses:
        "200":
          description: One page of users
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
    post:
      summary: Register an internal user of the tenant
      description: >
        The Tenant Administrator registers a user of their own tenant with one role among TENANT_ADMINISTRATOR,
        OPERATIONAL_COLLABORATOR, MANAGER, ACCOUNTANT and ANALYST (HU-SEC-005). The tenant is the tenantId of the token and
        nothing in the body can change it; a field that is not in the contract is 400. The password the Administrator types
        and its confirmation, which must match, follow the policy; the password is a temporary credential of 72 hours that
        only allows choosing another, it is stored only as a hash and is never returned. The tenant must be ACTIVE. An
        e-mail that already has an account in the tenant is 422 with the reason in details: an internal user, an inactive
        internal user who can be reactivated, or a Final Customer account. A repeat with the same Idempotency-Key answers
        200 with the user already created. Only a token with the role TENANT_ADMINISTRATOR, a tenant and no access mark is
        accepted: a collaborator, a customer, the Platform Administrator and a temporary or restricted token get 403.
      operationId: createInternalUser
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInternalUserRequest'
      responses:
        "201":
          $ref: '#/components/responses/Account'
        "200":
          $ref: '#/components/responses/Account'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/users/{accountId}/inactivation:
    post:
      summary: Inactivate an internal user of the tenant
      description: >
        The Tenant Administrator inactivates an active user of their own tenant with a reason of 1 to 500 characters (HU-SEC-005,
        AC4). In one transaction the account becomes INACTIVE, the sessions it had are cut, AccountSessionsRevoked is written
        with the actor and the reason, and who, when and why are kept with the account. The person can no longer sign in nor
        renew. The tenant and the actor are those of the token and nothing in the body can change them. Inactivating an
        inactive user is 422 INVALID_STATUS_TRANSITION. The last active Tenant Administrator of the tenant cannot be
        inactivated, not even by their own account: 422 BUSINESS_RULE_VIOLATION (AC6). A user of another tenant, a customer or
        an id that does not exist is 404. Only a token with the role TENANT_ADMINISTRATOR, a tenant and no access mark is accepted.
      operationId: inactivateInternalUser
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
      responses:
        "200":
          description: The user as it is now, with the last change
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/users/{accountId}/reactivation:
    post:
      summary: Reactivate an internal user of the tenant
      description: >
        The Tenant Administrator gives back the access of an inactive user of their own tenant with a reason of 1 to 500
        characters (HU-SEC-005, AC5). The same record is restored, with the same e-mail, role and identifier, and who, when and
        why are kept. The credentials issued before the inactivation stay cut: the person signs in again. Reactivating an
        active user is 422 INVALID_STATUS_TRANSITION; a user of another tenant, a customer or an id that does not exist is 404.
        Only a token with the role TENANT_ADMINISTRATOR, a tenant and no access mark is accepted.
      operationId: reactivateInternalUser
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
      responses:
        "200":
          description: The user as it is now, with the last change
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/users/{accountId}/temporary-credential:
    post:
      summary: Issue a new temporary credential to a user
      description: >
        Gives a user whose temporary credential expired before the first sign-in a new one of 72 hours, which invalidates any
        earlier one (HU-SEC-005, AC7; PDR section 9, G15 and GAP-016). The issuer types the password and its confirmation under
        the one policy; nothing is generated and the password is never returned. It can be issued only to an account that still
        has a temporary credential, in force or expired: one that already chose its own password is 422 BUSINESS_RULE_VIOLATION
        (that is the recovery of HU-SEC-004). Who may issue to whom: a Tenant Administrator, to any user of its own tenant except
        the first Administrator; the Platform Administrator, to the first Administrator of any tenant and, when the tenant has
        no active Tenant Administrator able to sign in, to any of its active Administrators; any other issuer is 422
        BUSINESS_RULE_VIOLATION. A user of another tenant, a customer or an id that does not exist is 404 for a Tenant
        Administrator. Who and when are kept with the account and AccountTemporaryCredentialIssued is written in the same
        transaction, without the password. Only a token with the role TENANT_ADMINISTRATOR and a tenant, or PLATFORM_ADMINISTRATOR
        and none, and no access mark, is accepted.
      operationId: issueTemporaryCredential
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTemporaryCredentialRequest'
      responses:
        "200":
          description: The user as it is now, with the end of the new credential
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/users/{accountId}/permission-grant:
    post:
      summary: Assign a special permission to a user of the tenant
      description: >
        The Tenant Administrator assigns one of the four special permissions to a user of their own tenant (HU-SEC-006, AC2, AC3). It
        reaches the credential from the next sign-in or refresh and cuts no session. A Tenant Administrator may receive only
        CONSULT_SENSITIVE_DATA, also themselves, since the other three are theirs by profile (422 BUSINESS_RULE_VIOLATION); an
        Operational Collaborator may receive any of the four; a Manager, an Accountant or an Analyst none (422
        BUSINESS_RULE_VIOLATION). Assigning a permission the user already holds changes nothing and answers the same 200: no trace, no
        event. A permission outside the four is 400. A user of another tenant, a customer or an id that does not exist is 404. Who
        assigned it and when are kept and SpecialPermissionGranted is written in the same transaction. Only a token with the role
        TENANT_ADMINISTRATOR, a tenant and no access mark is accepted.
      operationId: grantSpecialPermission
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionChangeRequest'
      responses:
        "200":
          description: The user as it is now
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/users/{accountId}/permission-removal:
    post:
      summary: Remove a special permission from a user of the tenant
      description: >
        The Tenant Administrator removes a special permission from a user of their own tenant (HU-SEC-006, AC7). In one transaction the
        permission stops being held, every session of the user is cut, and SpecialPermissionRevoked and AccountSessionsRevoked are
        written with the actor. A permission of the Tenant Administrator's profile cannot be removed (422 BUSINESS_RULE_VIOLATION).
        Removing a permission the user does not hold changes nothing and answers the same 200: no session is cut. A permission outside
        the four is 400; another tenant's user, a customer or an unknown id is 404. Only a token with the role TENANT_ADMINISTRATOR, a
        tenant and no access mark is accepted.
      operationId: removeSpecialPermission
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionChangeRequest'
      responses:
        "200":
          description: The user as it is now
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/optional-roles:
    get:
      summary: The optional roles of the tenant and whether each is enabled
      description: >
        Always the three optional roles (MANAGER, ACCOUNTANT, ANALYST), in that order, with whether the tenant of the token enabled each
        and who changed it and when (HU-SEC-006, AC5). A tenant starts with none enabled, except that one which already had users with a role
        before HU-SEC-006 starts with that role enabled. Not paginated: the set is closed and the
        route takes no parameter. Only a token with the role TENANT_ADMINISTRATOR, a tenant and no access mark is accepted.
      operationId: listOptionalRoles
      tags: [OptionalRoles]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The three optional roles of the tenant
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionalRoleList'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/optional-roles/{role}/enablement:
    post:
      summary: Enable an optional role for the tenant
      description: >
        The Tenant Administrator enables MANAGER, ACCOUNTANT or ANALYST for their tenant (HU-SEC-006, AC5): from then on a user can be
        registered with it. Enabling an enabled role is 422 INVALID_STATUS_TRANSITION; another role is 400. Who enabled it and when are
        kept and OptionalRoleEnabled is written in the same transaction. The route reads no body. Only a token with the role
        TENANT_ADMINISTRATOR, a tenant and no access mark is accepted.
      operationId: enableOptionalRole
      tags: [OptionalRoles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OptionalRolePath'
      responses:
        "200":
          description: The optional role as it is now
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionalRoleState'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/optional-roles/{role}/disablement:
    post:
      summary: Disable an optional role for the tenant
      description: >
        The Tenant Administrator disables an optional role of their tenant (HU-SEC-006, AC5). It is refused while an active user of the
        tenant holds it (422 BUSINESS_RULE_VIOLATION): no operation takes a role away from a person. Disabling a disabled role is 422
        INVALID_STATUS_TRANSITION; another role is 400. Who disabled it and when are kept and OptionalRoleDisabled is written in the
        same transaction. The route reads no body. Only a token with the role TENANT_ADMINISTRATOR, a tenant and no access mark is
        accepted.
      operationId: disableOptionalRole
      tags: [OptionalRoles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OptionalRolePath'
      responses:
        "200":
          description: The optional role as it is now
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionalRoleState'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/sessions/password:
    put:
      summary: Choose the own password
      description: >
        Only the token of a temporary credential (access password-change) is accepted, and only while the temporary
        credential is in force. The password follows the policy of 00-governance/security-policy.md (8 characters or
        more with an upper-case letter, a lower-case letter, a number and a special character, not a common one)
        and is at most 72 bytes, the limit of bcrypt; it differs from the temporary one. The temporary state and the
        failed sign-ins are cleared, older sessions of the account are cut off, and AccountSessionsRevoked waits in
        the outbox. Every other token, and a credential that cannot be changed, is the same 401.
      operationId: changeOwnPassword
      tags: [Sessions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        "204":
          description: Password changed
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/internal/outbox:
    get:
      summary: Read the events waiting
      description: >
        The pending events that are due, across tenants, the one due for longest first (then the one that happened
        first), with the listing envelope. Never routed by the gateway. Requires the role SERVICE and nothing else: no
        tenant, no other role, no access mark.
      operationId: listOutboxEvents
      tags: [Internal]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: status
          in: query
          schema: {type: string, enum: [PENDING], default: PENDING}
      responses:
        "200":
          description: The events waiting
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxPage'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/internal/outbox/{eventId}/published:
    post:
      summary: Mark an event delivered
      description: >
        Only after every consumer answered 201 or 200. A repeat answers 200 with the event as it is, and an event that
        had been given up is published all the same: a delivery that did succeed is true. Requires the role SERVICE.
      operationId: markOutboxEventPublished
      tags: [Internal]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
      responses:
        "200":
          $ref: '#/components/responses/OutboxEvent'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/internal/outbox/{eventId}/attempts:
    post:
      summary: Record a failed delivery
      description: >
        Counts the attempt, keeps the error and moves nextAttemptAt (5 s doubling to 15 min); the 20th attempt marks
        the event failed. An event that is no longer pending is not touched by a report that came late. Requires the
        role SERVICE.
      operationId: recordOutboxEventAttempt
      tags: [Internal]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboxAttemptRequest'
      responses:
        "200":
          $ref: '#/components/responses/OutboxEvent'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/internal/tenants/{tenantId}/events:
    post:
      summary: Receive an event about a tenant
      description: >
        Job 7 delivers TenantCreated, TenantInactivated and TenantReactivated of identity-audit, each with the full
        new state of the tenant in its payload (the service reads identifier and tenantStatus). The Idempotency-Key is
        the id of the event. The copy of the tenant takes the state of an event only when it is strictly newer than
        the one it holds: an older event, or a repeat, answers 200 and changes nothing. An identifier that another
        tenant still holds answers 503 with Retry-After, because it goes away when the event that renames that tenant
        arrives. Requires the role SERVICE and nothing else. The body is tolerant of fields it does not name, up to
        16 KB.
      operationId: receiveTenantEvent
      tags: [Internal]
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Idempotency-Key
          in: header
          required: true
          description: The id of the event, as the body says it
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantEventEnvelope'
      responses:
        "201":
          description: The event was applied
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        "200":
          description: The event changed nothing, because it was already received or an older one
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
        "503":
          description: The identifier is held by another tenant for now; deliver the event again
          headers:
            Retry-After:
              required: true
              schema: {type: string}
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/security/internal/tenants/{tenantId}/administrators:
    post:
      summary: Create the first Administrator of a tenant
      description: >
        Step 2 of the saga onboard-tenant. Creates the account of the first TENANT_ADMINISTRATOR of the tenant of the
        path, with the password the Platform Administrator typed as a temporary credential of 72 hours: the first
        sign-in only allows choosing another password. The saga is the authority that the tenant exists, so the copy
        of the tenant is not consulted. The Idempotency-Key is saga:step; a repeat answers 200 with the account already
        created and runs nothing. An e-mail that already has an account in that tenant is 422 with details naming the
        field email. Requires the role SERVICE and nothing else. The answer never carries a credential.
      operationId: createFirstAdministrator
      tags: [Internal]
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFirstAdministratorRequest'
      responses:
        "201":
          $ref: '#/components/responses/Account'
        "200":
          $ref: '#/components/responses/Account'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/security/public/tenants/{identifier}/email-verifications:
    post:
      summary: Ask for a new e-mail verification link
      description: >
        A person gives the e-mail of their account in the tenant of the link /t/{identifier}. The answer is always 202
        with no body when the request is well formed, whether the account exists, is pending, is already verified, has
        already received three links in the last hour, or the tenant is not active, so the route tells nobody which
        e-mails have an account (HU-SEC-003, RN-SEC-004-06). The work is done after the answer: a link is sent only to
        a PENDING account of an active tenant that received fewer than three links in the last hour, and it retires
        every earlier link of the account. It takes no Idempotency-Key. A malformed body, or an e-mail that cannot be
        one, is 400. The design contract also lists 500; this service never answers it here, because nothing is done
        before the answer.
      operationId: requestEmailVerification
      tags: [Accounts]
      security: []
      parameters:
        - name: identifier
          in: path
          required: true
          description: Identifier of the tenant, lowercase kebab-case
          schema:
            type: string
            minLength: 3
            maxLength: 40
            pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        "202":
          description: Accepted; a link is sent only when the rules allow it
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        "400":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
  /api/v1/security/public/tenants/{identifier}/email-verifications/confirmations:
    post:
      summary: Verify the e-mail with the link and the password
      description: >
        The page behind the link posts the value of the link (it travels after the hash in the e-mail, so it is never in
        a server log) together with the password of the account (HU-SEC-003, R-1: whoever registered another
        person's e-mail cannot activate it). On success the account becomes ACTIVE with emailVerified true, the link
        stops working and AccountEmailVerified waits in the outbox. A link that is used, expired, replaced by a newer
        one, unknown, of an account of another tenant or of a tenant that is not active is one 422
        (BUSINESS_RULE_VIOLATION). A valid link with a wrong password is 401, leaves the account pending and counts a
        failure toward the block of five in fifteen minutes; a blocked account is the same 401. An unknown identifier
        is 404.
      operationId: confirmEmailVerification
      tags: [Accounts]
      security: []
      parameters:
        - name: identifier
          in: path
          required: true
          description: Identifier of the tenant, lowercase kebab-case
          schema:
            type: string
            minLength: 3
            maxLength: 40
            pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmation'
      responses:
        "204":
          description: The account is verified and active
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "415":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One value per intent, the same on every retry (8 to 128 characters)
      schema: {type: string, minLength: 8, maxLength: 128}
    AccountIdPath:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OptionalRolePath:
      name: role
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OptionalRole'
    EventIdPath:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    CorrelationId:
      description: The correlation id of the request, reused when it is safe and generated otherwise; it is the traceId of an error
      required: true
      schema:
        type: string
    NoStore:
      description: A token or a refusal is never cached
      required: true
      schema:
        type: string
        enum: [no-store]
    Challenge:
      required: true
      schema:
        type: string
        enum: [Bearer]
  responses:
    OutboxEvent:
      description: The event as it is now
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OutboxEvent'
    Account:
      description: The account, created now (201) or by an earlier request with the same Idempotency-Key (200)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountResponse'
    Session:
      description: Signed in
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionResponse'
    Unauthorized:
      description: Every refusal of a sign-in, whatever its cause, in the same words
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        WWW-Authenticate:
          $ref: '#/components/headers/Challenge'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error:
      description: An error in the single envelope; the code says which
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SignInRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 20
          maxLength: 256
    EmailVerificationRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: {type: string, minLength: 3, maxLength: 254}
    EmailVerificationConfirmation:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The value of the link, base64url without padding (32 random bytes)
          pattern: '^[A-Za-z0-9_-]{43}$'
        password: {type: string, minLength: 1, maxLength: 128}
    TenantEventEnvelope:
      type: object
      description: The envelope of ADR-004 D4 as job 7 delivers it; fields it does not name are tolerated
      required: [eventId, eventType, eventVersion, tenantId, aggregateId, payload, occurredAt]
      properties:
        eventId: {type: string, format: uuid}
        eventType: {type: string, enum: [TenantCreated, TenantInactivated, TenantReactivated]}
        eventVersion: {type: integer, minimum: 1}
        tenantId: {type: string, format: uuid}
        aggregateId: {type: string, format: uuid}
        payload:
          type: object
          description: >
            The full new state of the tenant; the service reads identifier, tenantStatus and commercialName, the visible
            sender of the e-mails (cut to 100 characters; a name with a control character makes the envelope invalid)
          required: [identifier, tenantStatus]
          properties:
            tenantId: {type: string, format: uuid}
            identifier: {type: string, minLength: 3, maxLength: 40, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
            commercialName: {type: string}
            tenantStatus: {type: string, enum: [PENDING, ACTIVE, INACTIVE, FAILED]}
        correlationId: {type: string}
        occurredAt: {type: string, format: date-time}
    OutboxEvent:
      type: object
      description: An event waiting to be delivered, with the envelope of ADR-004 D4; dates are RFC 3339 in UTC
      required: [eventId, eventType, eventVersion, aggregateId, payload, correlationId, occurredAt, status, attempts, nextAttemptAt]
      properties:
        eventId: {type: string, format: uuid}
        eventType: {type: string, example: AccountSessionsRevoked}
        eventVersion: {type: integer, minimum: 1}
        tenantId: {type: string, format: uuid, description: Absent for the events of the Platform Administrator}
        aggregateId: {type: string, format: uuid}
        payload: {type: object}
        correlationId: {type: string}
        occurredAt: {type: string, format: date-time}
        publishedAt: {type: string, format: date-time}
        status: {type: string, enum: [PENDING, PUBLISHED, FAILED]}
        attempts: {type: integer, minimum: 0}
        lastError: {type: string}
        nextAttemptAt: {type: string, format: date-time}
    OutboxPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OutboxEvent'
        meta:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page: {type: integer, minimum: 1}
            limit: {type: integer, minimum: 1, maximum: 100}
            total: {type: integer, minimum: 0}
            totalPages: {type: integer, minimum: 0}
    OutboxAttemptRequest:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          minLength: 1
          maxLength: 1000
    ChangePasswordRequest:
      type: object
      required: [newPassword]
      additionalProperties: false
      properties:
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          description: At most 72 bytes, which the policy checks; the design contract says 128 characters
    CreateCustomerAccountRequest:
      type: object
      required: [firstName, lastName, email, phone, password, passwordConfirmation]
      additionalProperties: false
      properties:
        firstName: {type: string, minLength: 1, maxLength: 50}
        lastName: {type: string, minLength: 1, maxLength: 50}
        email: {type: string, minLength: 3, maxLength: 254}
        phone: {type: string, pattern: '^[0-9+() -]{7,20}$'}
        password: {type: string, minLength: 8, maxLength: 72, description: "At most 72 bytes, which the policy checks"}
        passwordConfirmation: {type: string, minLength: 1, maxLength: 72, description: Must match password}
    CreateInternalUserRequest:
      type: object
      required: [fullName, email, role, password, passwordConfirmation]
      additionalProperties: false
      properties:
        fullName: {type: string, minLength: 1, maxLength: 100}
        email: {type: string, minLength: 3, maxLength: 254}
        role:
          type: string
          enum: [TENANT_ADMINISTRATOR, OPERATIONAL_COLLABORATOR, MANAGER, ACCOUNTANT, ANALYST]
        password: {type: string, minLength: 8, maxLength: 72, description: "The temporary credential; at most 72 bytes, which the policy checks"}
        passwordConfirmation: {type: string, minLength: 1, maxLength: 72, description: Must match password}
    CreateFirstAdministratorRequest:
      type: object
      description: The password was already confirmed on the onboarding screen, so there is no confirmation here
      required: [fullName, email, password]
      additionalProperties: false
      properties:
        fullName: {type: string, minLength: 1, maxLength: 100}
        email: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 8, maxLength: 72, description: "The temporary credential; at most 72 bytes, which the policy checks"}
    AccountResponse:
      type: object
      description: An account of a tenant. Never carries a password, a hash or any credential.
      required: [accountId, tenantId, email, roles, permissions, accountStatus, emailVerified, createdAt]
      properties:
        accountId: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        fullName: {type: string}
        email: {type: string, description: "The e-mail as normalized (lower case, no surrounding spaces)"}
        phone: {type: string}
        roles:
          type: array
          items:
            type: string
            enum: [FINAL_CUSTOMER, TENANT_ADMINISTRATOR, OPERATIONAL_COLLABORATOR, MANAGER, ACCOUNTANT, ANALYST]
        accountStatus: {type: string, enum: [PENDING, ACTIVE, INACTIVE]}
        emailVerified: {type: boolean}
        temporaryCredentialUntil: {type: string, format: date-time, description: Present while a temporary credential is in force}
        createdAt: {type: string, format: date-time}
        statusChangedAt: {type: string, format: date-time, description: When the status last changed; absent if it never did}
        statusChangedBy: {type: string, description: "The actor of the last change, as tenant-administrator/<accountId>"}
        statusReason: {type: string, description: Why the status last changed}
        permissions:
          type: array
          description: The special permissions the user holds, as the credential carries them (HU-SEC-006)
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SpecialPermission'
    IssueTemporaryCredentialRequest:
      type: object
      required: [password, passwordConfirmation]
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: The temporary credential; at most 72 bytes, which the password policy checks
        passwordConfirmation:
          type: string
          minLength: 1
          maxLength: 72
          description: Must match password
    SpecialPermission:
      type: string
      description: The four special permissions of Phase 1 (PDR section 9); no other exists and none can be created
      enum: [VALIDATE_PAYMENT_PROOFS, MANAGE_CASH, MANAGE_DEPARTURE_EXECUTION, CONSULT_SENSITIVE_DATA]
    PermissionChangeRequest:
      type: object
      required: [permission]
      additionalProperties: false
      properties:
        permission:
          $ref: '#/components/schemas/SpecialPermission'
    OptionalRole:
      type: string
      description: The roles a tenant may enable (PDR section 9)
      enum: [MANAGER, ACCOUNTANT, ANALYST]
    OptionalRoleState:
      type: object
      required: [role, enabled]
      properties:
        role:
          $ref: '#/components/schemas/OptionalRole'
        enabled:
          type: boolean
        changedAt: {type: string, format: date-time, description: When the role last changed; absent if it never did}
        changedBy: {type: string, description: "The actor of the last change, as tenant-administrator/<accountId>; absent if it never changed"}
    OptionalRoleList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/OptionalRoleState'
    StatusChangeRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the access is cut or given back; kept with the account
    AccountPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccountResponse'
        meta:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page: {type: integer, minimum: 1}
            limit: {type: integer, minimum: 1, maximum: 100}
            total: {type: integer, minimum: 0}
            totalPages: {type: integer, minimum: 0}
    SessionResponse:
      type: object
      description: >
        The token pair. refreshToken is absent in the answer to a temporary credential and to a restricted access.
        The access token is a JWT signed with RS256, 15 minutes (10 for a temporary credential).
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Seconds
          example: 900
    ErrorResponse:
      type: object
      required: [error, message, traceId]
      properties:
        error:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, INVALID_STATUS_TRANSITION, BUSINESS_RULE_VIOLATION, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, SERVICE_UNAVAILABLE, INTERNAL_ERROR]
        message:
          type: string
        details:
          type: array
          description: One entry per invalid field with 400, and the field email with the 422 of an e-mail already in use
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}
        traceId:
          type: string
