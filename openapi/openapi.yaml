openapi: 3.0.3
info:
  title: Multitour security
  version: 0.1.0
  description: >
    The tested copy of the design contract 07-api/contracts/openapi/security.yaml in multi-tour-docs
    (ADR-004 D7). It carries only the operations the service implements, each as the design writes
    it; every story adds its operations here before its code.
paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  timestamp:
                    type: string
                    format: date-time
                  dependencies:
                    type: object
                    properties:
                      database:
                        type: string
                        enum: [ok, degraded, down]
        "503":
          description: Service unavailable (dependency down)
